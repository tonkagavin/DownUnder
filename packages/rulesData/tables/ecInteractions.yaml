  - id: ec.ulipristal.thenHormonal
    rxcui: "1007672"
    name: ulipristal
    direction: medMedInteractionContraceptionRelevant
    mechanism: pharmacodynamic
    severity: knownInteraction
    why: "Starting a hormonal method too soon after ulipristal emergency contraception can make the emergency dose less effective."
    whatToDo: "Guidance is to wait 5 days after ulipristal before starting a hormonal method, and to use a barrier method in between. Ask a pharmacist to time this."
